name: Maintenance check

# Watches the pins Dependabot cannot see (genekit's git tag, the CPython ceiling, the README
# pricing date, the TTS major cap) and whether uv.lock has moved since the last release.
# It keeps ONE issue up to date and never opens pull requests.
on:
  schedule:
    # 06:17 UTC on the 1st of each month; off the hour to avoid the top-of-hour queue.
    - cron: "17 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read   # checkout
      issues: write    # open, edit, or close the tracking issue
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      GITHUB_TOKEN: ${{ github.token }}
      ISSUE_TITLE: Monthly maintenance check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags: the release-due check diffs uv.lock against the last v* tag.
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Install the locked runtime dependencies
        run: uv sync --locked --no-dev

      - name: Run the pin checks
        run: uv run --no-sync python scripts/check_pins.py --report report.md

      - name: Open, update, or close the tracking issue
        run: |
          number="$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" \
            --json number,title --jq 'map(select(.title == env.ISSUE_TITLE)) | .[0].number // empty')"
          if [ -s report.md ]; then
            if [ -n "$number" ]; then
              gh issue edit "$number" --body-file report.md
            else
              gh issue create --title "$ISSUE_TITLE" --body-file report.md
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --comment "All maintenance checks pass as of $(date -u +%F)."
          fi
